<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | ZenitCU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #f5f8ff 0%, #edf3ff 100%);
      }

      .login-page {
        width: 100%;
        padding: 32px 18px;
      }

      .login-shell {
        width: min(440px, 100%);
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid rgba(19, 33, 61, 0.08);
        border-radius: 26px;
        box-shadow: 0 28px 60px rgba(17, 32, 72, 0.12);
        padding: 32px 28px;
      }

      .login-top {
        display: flex;
        justify-content: flex-start;
        margin-bottom: 18px;
      }

      .language-select-wrap {
        display: flex;
        align-items: center;
        justify-content: flex-start;
      }

      .language-select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        border: 1px solid rgba(19, 33, 61, 0.08);
        border-radius: 999px;
        background: #f8faff;
        color: var(--muted);
        padding: 8px 36px 8px 12px;
        font: inherit;
        font-size: 0.8rem;
        min-width: 140px;
        background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
        background-position: calc(100% - 16px) calc(50% - 2px), calc(100% - 11px) calc(50% - 2px);
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;
        outline: none;
      }

      .login-box {
        text-align: center;
      }

      .login-box h1 {
        font-size: clamp(2rem, 3vw, 2.5rem);
        line-height: 1.1;
        letter-spacing: -0.05em;
        margin-bottom: 8px;
      }

      .login-box p {
        color: var(--muted);
        text-align: center;
        margin-bottom: 0;
      }

      .login-form {
        display: grid;
        gap: 18px;
        margin-top: 28px;
      }

      .field-group {
        display: grid;
        gap: 8px;
        text-align: left;
      }

      .field-group label {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: 0.02em;
      }

      .field-group input {
        width: 100%;
        border: 1px solid rgba(19, 33, 61, 0.12);
        border-radius: 12px;
        min-height: 52px;
        padding: 0 14px;
        font: inherit;
        background: #f9fbff;
        color: var(--text);
        outline: none;
      }

      .field-group input:focus {
        border-color: rgba(34, 70, 211, 0.5);
        box-shadow: 0 0 0 4px rgba(34, 70, 211, 0.08);
      }

      .login-btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        min-height: 52px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-strong) 100%);
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 14px 28px rgba(34, 70, 211, 0.2);
      }

      .login-footer {
        margin-top: 18px;
        text-align: center;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .back-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid rgba(34, 70, 211, 0.18);
        background: #f3f7ff;
        color: var(--primary);
        font-weight: 700;
        text-decoration: none;
      }

      .login-footer a {
        color: var(--primary);
        font-weight: 700;
      }

      @media (max-width: 560px) {
        .login-shell {
          padding: 24px 18px;
        }

        .login-box h1 {
          font-size: 1.9rem;
        }
      }
    </style>
  </head>
  <body class="login-page">
    <div class="login-shell">
      <div class="login-top">
        <div class="language-select-wrap">
          <select class="language-select" aria-label="Select language">
            <option>English</option>
            <option>French</option>
            <option>Spanish</option>
            <option>Arabic</option>
          </select>
        </div>
      </div>

      <div class="login-box">
        <h1>Sign In</h1>
        <p>Log in to your account to continue.</p>

        <form class="login-form">
          <div class="field-group">
            <label for="account-number">Account Number</label>
            <input id="account-number" type="text" placeholder="Enter account number" />
          </div>

          <div class="field-group">
            <label for="password">Pin</label>
            <input id="password" type="password" placeholder="Enter PIN" />
          </div>

          <button type="submit" class="login-btn">Log In</button>
        </form>

        <a href="index.html" class="back-home">Home</a>

        <div class="login-footer">
          Hello! How is everyone over there?
        </div>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
